  <rect x="976" y="13" width="200" height="22" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="1076" y="27.5" text-anchor="middle" class="mono" font-size="10" fill="#475569">SYNCED 2026-11-19 UTC</text>

  <g transform="translate(24, 46)">
