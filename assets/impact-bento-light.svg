<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 232" width="100%" role="img" aria-label="Scientific Impact and Benchmark Metrics Dashboard">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="violetBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="roseBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <style>
      .sans { font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.45; }
      }
      @keyframes barPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.65; }
      }
      .p-dot { animation: pulseGlow 2.4s ease-in-out infinite; }
      .p-bar { animation: barPulse 3.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="1196" height="228" rx="20" fill="url(#cardBg)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Section Micro-Header -->
  <text x="26" y="30" class="mono" font-size="11" font-weight="700" fill="#475569" letter-spacing="1.6">RESEARCH TELEMETRY &amp; BLIND BENCHMARK LEADERSHIP</text>
  <circle cx="1164" cy="26" r="4" fill="#0891B2" class="p-dot"/>
  <text x="1152" y="30" text-anchor="end" class="mono" font-size="10.5" fill="#0284C7">LIVE IMPACT PROFILE</text>

  <!-- 5 Bento KPI Tiles: width=220 each, gap=14, left margin=22 => 22 + 5*220 + 4*14 = 1178 (right margin=22) -->
  <!-- Tile 1: Scholarship -->
  <g transform="translate(22, 44)">
    <rect x="0" y="0" width="220" height="126" rx="14" fill="url(#tileBg)" stroke="#22D3EE" stroke-opacity="0.34" stroke-width="1.2"/>
    <rect x="16" y="14" width="46" height="3.5" rx="2" fill="url(#cyanBar)" class="p-bar"/>
    <text x="204" y="21" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#0E7490">SCHOLARSHIP</text>
    <text x="16" y="62" class="sans" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.8">6,560<tspan fill="#0891B2" font-size="24">+</tspan></text>
    <text x="16" y="84" class="sans" font-size="12.5" font-weight="600" fill="#334155">Citations · 89 Q1 Papers</text>
    <text x="16" y="106" class="mono" font-size="11" fill="#475569">h-index 49 · i10-index 105</text>
  </g>

  <!-- Tile 2: Blind Benchmark -->
  <g transform="translate(256, 44)">
    <rect x="0" y="0" width="220" height="126" rx="14" fill="url(#tileBg)" stroke="#F59E0B" stroke-opacity="0.38" stroke-width="1.2"/>
    <rect x="16" y="14" width="46" height="3.5" rx="2" fill="url(#goldBar)" class="p-bar"/>
    <text x="204" y="21" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#B45309">ALCHEMISTRY '27</text>
    <text x="16" y="62" class="sans" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.8">#1 <tspan fill="#D97706" font-size="20" font-weight="700">Indep.</tspan></text>
    <text x="16" y="84" class="sans" font-size="12.5" font-weight="600" fill="#334155">2nd Overall · OpenADMET</text>
    <text x="16" y="106" class="mono" font-size="11" fill="#475569">Blind RBFE τ=0.48 · ρ=0.66</text>
  </g>

  <!-- Tile 3: Active Learning & Clinical -->
  <g transform="translate(490, 44)">
    <rect x="0" y="0" width="220" height="126" rx="14" fill="url(#tileBg)" stroke="#8B5CF6" stroke-opacity="0.38" stroke-width="1.2"/>
    <rect x="16" y="14" width="46" height="3.5" rx="2" fill="url(#violetBar)" class="p-bar"/>
    <text x="204" y="21" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#6D28D9">DRUG DISCOVERY</text>
    <text x="16" y="62" class="sans" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.8">2.5B<tspan fill="#7C3AED" font-size="24">+</tspan></text>
    <text x="16" y="84" class="sans" font-size="12.5" font-weight="600" fill="#334155">Molecules · Phase II Trials</text>
    <text x="16" y="106" class="mono" font-size="11" fill="#475569">DoD/DARPA · 60% less wet-lab</text>
  </g>

  <!-- Tile 4: Agentic AI & Open Source -->
  <g transform="translate(724, 44)">
    <rect x="0" y="0" width="220" height="126" rx="14" fill="url(#tileBg)" stroke="#10B981" stroke-opacity="0.38" stroke-width="1.2"/>
    <rect x="16" y="14" width="46" height="3.5" rx="2" fill="url(#emeraldBar)" class="p-bar"/>
    <text x="204" y="21" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#047857">AGENTIC BIO-AI</text>
    <text x="16" y="62" class="sans" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.8">2,000<tspan fill="#059669" font-size="24">+</tspan></text>
    <text x="16" y="84" class="sans" font-size="12.5" font-weight="600" fill="#334155">Agentic Bio-Skills &amp; Evals</text>
    <text x="16" y="106" class="mono" font-size="11" fill="#475569">15 PandaVerse · Biomni + AGY</text>
  </g>

  <!-- Tile 5: Funding & IP -->
  <g transform="translate(958, 44)">
    <rect x="0" y="0" width="220" height="126" rx="14" fill="url(#tileBg)" stroke="#F43F5E" stroke-opacity="0.38" stroke-width="1.2"/>
    <rect x="16" y="14" width="46" height="3.5" rx="2" fill="url(#roseBar)" class="p-bar"/>
    <text x="204" y="21" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#BE123C">TRANSLATION</text>
    <text x="16" y="62" class="sans" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.8">$8M<tspan fill="#E11D48" font-size="24">+</tspan></text>
    <text x="16" y="84" class="sans" font-size="12.5" font-weight="600" fill="#334155">Funding &amp; 1 US Patent App.</text>
    <text x="16" y="106" class="mono" font-size="11" fill="#475569">US20250339544A1 · 8+ yrs</text>
  </g>

  <!-- Bottom Highlight Benchmark Strip -->
  <g transform="translate(22, 184)">
    <rect x="0" y="0" width="1156" height="32" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-opacity="0.85" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#059669" class="p-dot"/>
    <text x="32" y="20" class="mono" font-size="11.2" fill="#334155">
      <tspan fill="#047857" font-weight="700">ARC VIRTUAL CELL '26:</tspan> 1,648 teams · Blind zero-shot CRISPRi (900 knockdowns)   <tspan fill="#94A3B8">|</tspan>   <tspan fill="#0E7490" font-weight="700">PANDADOCK:</tspan> Pearson R=0.88 · 8.5–35× GPU   <tspan fill="#94A3B8">|</tspan>   <tspan fill="#6D28D9" font-weight="700">SAIR:</tspan> 5.2M Boltz-1x
    </text>
  </g>
</svg>
