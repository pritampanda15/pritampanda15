<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 148" width="100%" role="img" aria-label="Science moves faster when the models, physics, and tools are open">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <radialGradient id="fAura1" cx="25%" cy="100%" r="48%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#0A84FF" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fAura2" cx="75%" cy="100%" r="48%">
      <stop offset="0%" stop-color="#BF5AF2" stop-opacity="0.11"/>
      <stop offset="45%" stop-color="#BF5AF2" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#BF5AF2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipFoot"><rect x="2" y="2" width="1196" height="144" rx="22"/></clipPath>
    <style>

      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Monaco, Consolas, monospace; }
      .num { font-variant-numeric: tabular-nums; }

    </style>
  </defs>

  <g clip-path="url(#clipFoot)">
    <rect x="0" y="0" width="1200" height="148" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="148" fill="url(#fAura1)"/>
    <rect x="0" y="0" width="1200" height="148" fill="url(#fAura2)"/>
    <line x1="26" y1="3" x2="1174" y2="3" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.2"/>

    <text x="600" y="68" text-anchor="middle" class="display" font-size="22" font-weight="700" fill="#F5F5F7" letter-spacing="-0.35">
      “Science moves faster when the models, physics, and tools are open.”
    </text>
    <text x="600" y="102" text-anchor="middle" class="text" font-size="14" font-weight="500" fill="#8E8E93" letter-spacing="0.03em">
      Pritam Kumar Panda, PhD  ·  Stanford Medicine  ·  PandaVerse  ·  atomodyssey.com
    </text>
  </g>

  <rect x="2" y="2" width="1196" height="144" rx="22" fill="none" stroke="#2C2C30" stroke-width="1.2"/>
</svg>
