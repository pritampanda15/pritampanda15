<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" width="100%" role="img" aria-label="Science moves faster when the models, physics, and tools are open">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0B1328"/>
      <stop offset="100%" stop-color="#11102D"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="footBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.4"/>
    </linearGradient>
    <clipPath id="footClip">
      <rect x="2" y="2" width="1196" height="128" rx="18"/>
    </clipPath>
    <style>
      .sans { font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      @keyframes waveShift1 {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-600px); }
      }
      @keyframes waveShift2 {
        0% { transform: translateX(-600px); }
        100% { transform: translateX(0px); }
      }
      @keyframes floatDot {
        0%, 100% { transform: translateY(0px); opacity: 0.85; }
        50% { transform: translateY(-9px); opacity: 0.3; }
      }
      .w1 { animation: waveShift1 12s linear infinite; }
      .w2 { animation: waveShift2 16s linear infinite; }
      .fd1 { animation: floatDot 4.2s ease-in-out infinite; }
      .fd2 { animation: floatDot 5.1s ease-in-out 1.1s infinite; }
      .fd3 { animation: floatDot 4.7s ease-in-out 2.2s infinite; }
    </style>
  </defs>

  <g clip-path="url(#footClip)">
    <rect x="0" y="0" width="1200" height="132" fill="url(#footBg)"/>

    <!-- Dual Seamless Animated Bioluminescent Waves -->
    <g class="w1">
      <path d="M 0 86 Q 150 52, 300 86 T 600 86 T 900 86 T 1200 86 T 1500 86 T 1800 86 L 1800 136 L 0 136 Z" fill="url(#wave1)"/>
    </g>
    <g class="w2">
      <path d="M 0 98 Q 150 68, 300 98 T 600 98 T 900 98 T 1200 98 T 1500 98 T 1800 98 L 1800 136 L 0 136 Z" fill="url(#wave2)"/>
    </g>

    <!-- Floating Molecular Particles -->
    <circle cx="140" cy="44" r="3" fill="#22D3EE" class="fd1"/>
    <circle cx="235" cy="72" r="2.2" fill="#A78BFA" class="fd2"/>
    <circle cx="965" cy="42" r="3" fill="#34D399" class="fd3"/>
    <circle cx="1068" cy="68" r="2.5" fill="#FB7185" class="fd1"/>
    <circle cx="88" cy="78" r="2" fill="#FBBF24" class="fd2"/>
    <circle cx="1115" cy="36" r="2.2" fill="#38BDF8" class="fd3"/>

    <!-- Centered Motto -->
    <text x="600" y="54" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#F8FAFC" letter-spacing="0.2">
      “Science moves faster when the models, physics, and tools are open.”
    </text>
    <text x="600" y="80" text-anchor="middle" class="mono" font-size="11.5" fill="#94A3B8" letter-spacing="1.2">
      PRITAM KUMAR PANDA, PhD  ·  STANFORD MEDICINE  ·  PANDAVERSE  ·  ATOMODYSSEY.COM
    </text>
  </g>

  <rect x="2" y="2" width="1196" height="128" rx="18" fill="none" stroke="url(#footBorder)" stroke-width="1.4"/>
</svg>
