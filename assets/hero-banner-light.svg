<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-label="Pritam Kumar Panda, PhD — AI for Science, Computational Drug Discovery and Agentic Bio-AI at Stanford Medicine">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="100%" stop-color="#EFEFF4"/>
    </linearGradient>
    <!-- Eased multi-stop ambient washes (no harsh edge) -->
    <radialGradient id="auraBlue" cx="82%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.10"/>
      <stop offset="35%" stop-color="#0071E3" stop-opacity="0.06"/>
      <stop offset="70%" stop-color="#0071E3" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraPurple" cx="15%" cy="15%" r="48%">
      <stop offset="0%" stop-color="#8944AB" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#8944AB" stop-opacity="0.04"/>
      <stop offset="75%" stop-color="#8944AB" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#8944AB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleInk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D1D1F"/><stop offset="70%" stop-color="#1D1D1F"/><stop offset="100%" stop-color="#0055B3"/>
    </linearGradient>
    <linearGradient id="ligandRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="55%" stop-color="#8944AB"/>
      <stop offset="100%" stop-color="#007A8C"/>
    </linearGradient>
    <pattern id="fineGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#86868B" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
        <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="128%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.055"/>
    </filter>
    <clipPath id="clipHero"><rect x="2" y="2" width="1196" height="396" rx="26"/></clipPath>
    <style>

      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Monaco, Consolas, monospace; }
      .num { font-variant-numeric: tabular-nums; }


      /* Restraint (remove-animations): zero hidden opacity:0 start states on static/functional cards */

      @keyframes dashFlow { to { stroke-dashoffset: -40; } }
      .hbond { stroke-dasharray: 5 5; animation: dashFlow 3.2s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .hbond { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#clipHero)">
    <rect x="0" y="0" width="1200" height="400" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="400" fill="url(#fineGrid)"/>
    <rect x="0" y="0" width="1200" height="400" fill="url(#auraPurple)"/>
    <rect x="0" y="0" width="1200" height="400" fill="url(#auraBlue)"/>
    <!-- Apple specular top highlight edge -->
    <line x1="28" y1="3" x2="1172" y2="3" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="1.5"/>

    <!-- Status Capsule (Decoration: fades gently with Lead) -->
    <g transform="translate(52, 42)" class="e-dec">
      <rect x="0" y="0" width="438" height="34" rx="17" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="19" cy="17" r="5" fill="#248A3D"/>
      <text x="34" y="21.5" class="text" font-size="13.5" font-weight="600" fill="#1D1D1F" letter-spacing="0.01em">Stanford Medicine · Open to Research &amp; AI Roles</text>
    </g>

    <!-- Lead: Display Name (Optical sizing: 54px, negative tracking -0.03em) -->
    <g class="e-lead">
      <text x="52" y="138" class="display" font-size="54" font-weight="800" fill="url(#titleInk)" letter-spacing="-1.6">Pritam Kumar Panda<tspan font-size="28" font-weight="700" fill="#0071E3" dx="10" letter-spacing="-0.4">PhD</tspan></text>
    </g>

    <!-- Support 1: Role Subtitle -->
    <g class="e-sup1">
      <text x="52" y="178" class="display" font-size="22" font-weight="600" fill="#424245" letter-spacing="-0.3">
        AI for Science <tspan fill="#0071E3">·</tspan> Computational Drug Discovery <tspan fill="#8944AB">·</tspan> Agentic Bio-AI
      </text>
    </g>

    <!-- Support 2: Concise Body Copy (16.5px, comfortable leading, ~64ch max) -->
    <g class="e-sup2">
      <text x="52" y="217" class="text" font-size="16.5" font-weight="400" fill="#6E6E73">
        Building protein foundation models, SE(3)-equivariant GNNs, GPU docking &amp;
      </text>
      <text x="52" y="242" class="text" font-size="16.5" font-weight="400" fill="#6E6E73">
        alchemical FEP engines, virtual-cell models, and eval-driven bio-AI harnesses.
      </text>
    </g>

    <!-- Support 3: 4 Apple-tinted Capability Capsules (13.5px) -->
    <g transform="translate(52, 272)" class="e-sup3">
      <rect x="0" y="0" width="166" height="34" rx="17" fill="#EDF5FF" stroke="#BFDDFC" stroke-width="1"/>
      <text x="83" y="21.5" text-anchor="middle" class="text" font-size="13.5" font-weight="600" fill="#0055B3">AF3 · Boltz-2 · JAX</text>

      <rect x="178" y="0" width="180" height="34" rx="17" fill="#F6EFFB" stroke="#DFC6F0" stroke-width="1"/>
      <text x="268" y="21.5" text-anchor="middle" class="text" font-size="13.5" font-weight="600" fill="#6B2E8A">PandaDock · OpenFE</text>

      <rect x="370" y="0" width="194" height="34" rx="17" fill="#ECF9EF" stroke="#B8E6C3" stroke-width="1"/>
      <text x="467" y="21.5" text-anchor="middle" class="text" font-size="13.5" font-weight="600" fill="#186A2D">2,000+ Bio-Agent Skills</text>

      <rect x="576" y="0" width="174" height="34" rx="17" fill="#FFF5EB" stroke="#F5D0A9" stroke-width="1"/>
      <text x="663" y="21.5" text-anchor="middle" class="text" font-size="13.5" font-weight="600" fill="#8F3F00">#1 Alchemistry 2027</text>
    </g>

    <!-- Bottom Hairline & Institutional Path (13.5px) -->
    <line x1="52" y1="334" x2="778" y2="334" stroke="#E5E5EA" stroke-width="1"/>
    <text x="52" y="364" class="text" font-size="13.8" font-weight="500" fill="#6E6E73">
      <tspan fill="#1D1D1F" font-weight="600">Stanford, CA</tspan>   ·   PhD Uppsala · Karolinska · DKFZ   ·   <tspan fill="#1D1D1F" font-weight="600">Nextflow Ambassador</tspan> · Sigma Xi
    </text>

    <!-- RIGHT EXPLANATORY MOTION GRAPHIC: SE(3) PROTEIN-LIGAND BINDING POCKET -->
    <g transform="translate(974, 200)">
      <!-- Calm rotating concentric binding-pocket orbitals -->
      <g opacity="0.78">
        <ellipse cx="0" cy="0" rx="142" ry="66" fill="none" stroke="#0071E3" stroke-opacity="0.28" stroke-width="1.3" stroke-dasharray="6 6">
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="42s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="0" cy="0" rx="124" ry="56" fill="none" stroke="#8944AB" stroke-opacity="0.30" stroke-width="1.3" transform="rotate(60)">
          <animateTransform attributeName="transform" type="rotate" from="60 0 0" to="-300 0 0" dur="34s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="0" cy="0" rx="112" ry="50" fill="none" stroke="#007A8C" stroke-opacity="0.24" stroke-width="1.2" transform="rotate(-55)">
          <animateTransform attributeName="transform" type="rotate" from="-55 0 0" to="305 0 0" dur="38s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- Non-covalent H-bond & pi-stacking tracks with explanatory interaction packets -->
      <path d="M -114 -68 Q -58 -50 -30 -18" fill="none" stroke="#0071E3" stroke-width="1.6" class="hbond" opacity="0.65"/>
      <path d="M 118 -58 Q 64 -40 30 -18" fill="none" stroke="#8944AB" stroke-width="1.6" class="hbond" opacity="0.65"/>
      <path d="M 108 82 Q 54 54 30 18" fill="none" stroke="#248A3D" stroke-width="1.6" class="hbond" opacity="0.65"/>
      <path d="M -110 76 Q -56 48 -30 18" fill="none" stroke="#D70015" stroke-width="1.6" class="hbond" opacity="0.65"/>
      <path d="M 0 -122 Q 10 -72 0 -36" fill="none" stroke="#D97706" stroke-width="1.5" class="hbond" opacity="0.65"/>

      <circle r="3.4" fill="#0071E3" opacity="0">
        <animateMotion dur="3.0s" repeatCount="indefinite" path="M -114 -68 Q -58 -50 -30 -18"/>
        <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.14;0.86;1" dur="3.0s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.4" fill="#8944AB" opacity="0">
        <animateMotion dur="3.5s" repeatCount="indefinite" path="M 118 -58 Q 64 -40 30 -18"/>
        <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.14;0.86;1" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.2" fill="#248A3D" opacity="0">
        <animateMotion dur="3.2s" repeatCount="indefinite" path="M 108 82 Q 54 54 30 18"/>
        <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.14;0.86;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.2" fill="#D70015" opacity="0">
        <animateMotion dur="3.8s" repeatCount="indefinite" path="M -110 76 Q -56 48 -30 18"/>
        <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.14;0.86;1" dur="3.8s" repeatCount="indefinite"/>
      </circle>

      <!-- Binding-pocket residue nodes -->
      <circle cx="-114" cy="-68" r="7.5" fill="#FFFFFF" stroke="#0071E3" stroke-width="2.4"/>
      <circle cx="118" cy="-58" r="7.5" fill="#FFFFFF" stroke="#8944AB" stroke-width="2.4"/>
      <circle cx="108" cy="82" r="7.5" fill="#FFFFFF" stroke="#248A3D" stroke-width="2.4"/>
      <circle cx="-110" cy="76" r="7" fill="#FFFFFF" stroke="#D70015" stroke-width="2.4"/>
      <circle cx="0" cy="-122" r="6.5" fill="#FFFFFF" stroke="#D97706" stroke-width="2.4"/>

      <!-- Central Aromatic Ligand Core (calm, anchored — no 0.2 Hz bobbing) -->
      <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="#FFFFFF" stroke="url(#ligandRing)" stroke-width="3" filter="url(#cardShadow)"/>
      <polygon points="0,-23 20,-11.5 20,11.5 0,23 -20,11.5 -20,-11.5" fill="none" stroke="#0071E3" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="14 6"/>
      <line x1="31" y1="-18" x2="56" y2="-31" stroke="#8944AB" stroke-width="2.4"/>
      <circle cx="58" cy="-32" r="5.5" fill="#8944AB"/>
      <line x1="-31" y1="18" x2="-56" y2="31" stroke="#0071E3" stroke-width="2.4"/>
      <circle cx="-58" cy="32" r="5.5" fill="#0071E3"/>
      <line x1="0" y1="36" x2="0" y2="62" stroke="#248A3D" stroke-width="2.4"/>
      <circle cx="0" cy="64" r="5.2" fill="#248A3D"/>
      <text x="0" y="5" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#1D1D1F">SE(3)</text>

      <!-- Clean Anchored Micro-Tags (12.5px, static for effortless reading) -->
      <g transform="translate(-170, -142)">
        <rect x="0" y="0" width="106" height="28" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="53" y="18.5" text-anchor="middle" class="mono" font-size="12.2" font-weight="600" fill="#0055B3">ΔΔG · FEP</text>
      </g>
      <g transform="translate(86, -142)">
        <rect x="0" y="0" width="102" height="28" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="51" y="18.5" text-anchor="middle" class="mono" font-size="12.2" font-weight="600" fill="#186A2D">MLIP · QM</text>
      </g>
      <g transform="translate(78, 118)">
        <rect x="0" y="0" width="112" height="28" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="56" y="18.5" text-anchor="middle" class="mono num" font-size="12.2" font-weight="600" fill="#6B2E8A">R = 0.88</text>
      </g>
    </g>
  </g>

  <rect x="2" y="2" width="1196" height="396" rx="26" fill="none" stroke="#E2E2E7" stroke-width="1.2"/>
</svg>
