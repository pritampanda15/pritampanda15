    <rect x="16" y="16" width="42" height="24" rx="12" fill="#EDF5FF" stroke="#BFDDFC"/>
    <text x="37" y="32" text-anchor="middle" class="mono num" font-size="12" font-weight="700" fill="#0055B3">01</text>
    <text x="192" y="32" text-anchor="end" class="text" font-size="11.5" font-weight="700" fill="#6E6E73" letter-spacing="0.06em">OMICS</text>
    <text x="16" y="68" class="display" font-size="18" font-weight="700" fill="#1D1D1F" letter-spacing="-0.25">Targets &amp; Cell</text>
    <line x1="16" y1="82" x2="192" y2="82" stroke="#E5E5EA" stroke-width="1"/>
    <text x="16" y="108" class="text" font-size="13.5" fill="#424245">· CRISPRi Perturbation</text>
    <text x="16" y="134" class="text" font-size="13.5" fill="#424245">· scRNA &amp; Spatial</text>
    <text x="16" y="160" class="text" font-size="13.5" fill="#424245">· WES/WGS · Biomarkers</text>
  </g>
  <g transform="translate(260, 56)">
    <rect x="0" y="0" width="208" height="184" rx="18" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="42" height="24" rx="12" fill="#F6EFFB" stroke="#DFC6F0"/>
    <text x="37" y="32" text-anchor="middle" class="mono num" font-size="12" font-weight="700" fill="#6B2E8A">02</text>
    <text x="192" y="32" text-anchor="end" class="text" font-size="11.5" font-weight="700" fill="#6E6E73" letter-spacing="0.06em">GEN-AI</text>
    <text x="16" y="68" class="display" font-size="18" font-weight="700" fill="#1D1D1F" letter-spacing="-0.25">Foundation ML</text>
    <line x1="16" y1="82" x2="192" y2="82" stroke="#E5E5EA" stroke-width="1"/>
    <text x="16" y="108" class="text" font-size="13.5" fill="#424245">· AlphaFold3 · Boltz-2</text>
    <text x="16" y="134" class="text" font-size="13.5" fill="#424245">· SE(3) GNNs · RFdiff</text>
    <text x="16" y="160" class="text" font-size="13.5" fill="#424245">· PyTorch · JAX · NeMo</text>
  </g>
  <g transform="translate(496, 56)">
    <rect x="0" y="0" width="208" height="184" rx="18" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="42" height="24" rx="12" fill="#ECF9EF" stroke="#B8E6C3"/>
    <text x="37" y="32" text-anchor="middle" class="mono num" font-size="12" font-weight="700" fill="#186A2D">03</text>
    <text x="192" y="32" text-anchor="end" class="text" font-size="11.5" font-weight="700" fill="#6E6E73" letter-spacing="0.06em">PHYSICS</text>
    <text x="16" y="68" class="display" font-size="18" font-weight="700" fill="#1D1D1F" letter-spacing="-0.25">Docking &amp; FEP</text>
