    <text x="16" y="160" class="text" font-size="13.5" fill="#424245">· Graph RAG · MCP</text>
  </g>
  <g transform="translate(968, 56)">
    <rect x="0" y="0" width="208" height="184" rx="18" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="42" height="24" rx="12" fill="#FFF0F1" stroke="#F8C2C7"/>
    <text x="37" y="32" text-anchor="middle" class="mono num" font-size="12" font-weight="700" fill="#AD0011">05</text>
    <text x="192" y="32" text-anchor="end" class="text" font-size="11.5" font-weight="700" fill="#6E6E73" letter-spacing="0.06em">CLINIC</text>
    <text x="16" y="68" class="display" font-size="18" font-weight="700" fill="#1D1D1F" letter-spacing="-0.25">Translation</text>
    <line x1="16" y1="82" x2="192" y2="82" stroke="#E5E5EA" stroke-width="1"/>
    <text x="16" y="108" class="text" font-size="13.5" fill="#424245">· 2.5B+ Screened</text>
    <text x="16" y="134" class="text" font-size="13.5" fill="#424245">· Phase II Trials</text>
    <text x="16" y="160" class="text" font-size="13.5" fill="#424245">· PandaVerse Open Tools</text>
