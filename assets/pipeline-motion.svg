  <g transform="translate(968, 56)">
    <rect x="0" y="0" width="208" height="184" rx="18" fill="#1C1C1F" stroke="#2C2C30" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="42" height="24" rx="12" fill="#36121C" stroke="#6B2236"/>
    <text x="37" y="32" text-anchor="middle" class="mono num" font-size="12" font-weight="700" fill="#FF859D">05</text>
    <text x="192" y="32" text-anchor="end" class="text" font-size="11.5" font-weight="700" fill="#8E8E93" letter-spacing="0.06em">CLINIC</text>
    <text x="16" y="68" class="display" font-size="18" font-weight="700" fill="#F5F5F7" letter-spacing="-0.25">Translation</text>
    <line x1="16" y1="82" x2="192" y2="82" stroke="#2C2C30" stroke-width="1"/>
    <text x="16" y="108" class="text" font-size="13.5" fill="#D1D1D6">· 2.5B+ Screened</text>
    <text x="16" y="134" class="text" font-size="13.5" fill="#D1D1D6">· Phase II Trials</text>
    <text x="16" y="160" class="text" font-size="13.5" fill="#D1D1D6">· PandaVerse Open Tools</text>
  </g>

  <!-- Closed-Loop Feedback Curve Returning from Stage 5 -> Stage 1 -->
  <path d="M 1072 240 L 1072 284 Q 1072 302 1054 302 L 146 302 Q 128 302 128 284 L 128 246" fill="none" stroke="url(#fbGrad)" stroke-width="2.2" class="rev"/>
  <polygon points="128,240 121,252 135,252" fill="#0A84FF"/>

  <circle r="4.2" fill="#30D158" opacity="0">
    <animateMotion dur="5.2s" repeatCount="indefinite" path="M 1072 240 L 1072 284 Q 1072 302 1054 302 L 146 302 Q 128 302 128 284 L 128 246"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="5.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.8" fill="#0A84FF" opacity="0">
    <animateMotion dur="5.2s" begin="2.6s" repeatCount="indefinite" path="M 1072 240 L 1072 284 Q 1072 302 1054 302 L 146 302 Q 128 302 128 284 L 128 246"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="5.2s" begin="2.6s" repeatCount="indefinite"/>
