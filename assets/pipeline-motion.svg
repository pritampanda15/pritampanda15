  <g transform="translate(362, 285)">
    <rect x="0" y="0" width="476" height="34" rx="17" fill="#1C1C1F" stroke="#1E5933" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="238" y="21.5" text-anchor="middle" class="text" font-size="13.5" font-weight="600" fill="#6EE792">⟲ Closed-Loop Active Learning · Wet-Lab Experimental Feedback</text>
