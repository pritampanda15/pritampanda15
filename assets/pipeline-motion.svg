    <rect x="16" y="16" width="42" height="24" rx="12" fill="#10233B" stroke="#1F4B7A"/>
    <text x="37" y="32" text-anchor="middle" class="mono num" font-size="12" font-weight="700" fill="#64B5FF">01</text>
    <text x="192" y="32" text-anchor="end" class="text" font-size="11.5" font-weight="700" fill="#8E8E93" letter-spacing="0.06em">OMICS</text>
    <text x="16" y="68" class="display" font-size="18" font-weight="700" fill="#F5F5F7" letter-spacing="-0.25">Targets &amp; Cell</text>
    <line x1="16" y1="82" x2="192" y2="82" stroke="#2C2C30" stroke-width="1"/>
    <text x="16" y="108" class="text" font-size="13.5" fill="#D1D1D6">· CRISPRi Perturbation</text>
    <text x="16" y="134" class="text" font-size="13.5" fill="#D1D1D6">· scRNA &amp; Spatial</text>
    <text x="16" y="160" class="text" font-size="13.5" fill="#D1D1D6">· WES/WGS · Biomarkers</text>
  </g>
  <g transform="translate(260, 56)">
    <rect x="0" y="0" width="208" height="184" rx="18" fill="#1C1C1F" stroke="#2C2C30" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="42" height="24" rx="12" fill="#281736" stroke="#522D70"/>
    <text x="37" y="32" text-anchor="middle" class="mono num" font-size="12" font-weight="700" fill="#DDA0FF">02</text>
    <text x="192" y="32" text-anchor="end" class="text" font-size="11.5" font-weight="700" fill="#8E8E93" letter-spacing="0.06em">GEN-AI</text>
    <text x="16" y="68" class="display" font-size="18" font-weight="700" fill="#F5F5F7" letter-spacing="-0.25">Foundation ML</text>
    <line x1="16" y1="82" x2="192" y2="82" stroke="#2C2C30" stroke-width="1"/>
    <text x="16" y="108" class="text" font-size="13.5" fill="#D1D1D6">· AlphaFold3 · Boltz-2</text>
    <text x="16" y="134" class="text" font-size="13.5" fill="#D1D1D6">· SE(3) GNNs · RFdiff</text>
    <text x="16" y="160" class="text" font-size="13.5" fill="#D1D1D6">· PyTorch · JAX · NeMo</text>
  </g>
  <g transform="translate(496, 56)">
    <rect x="0" y="0" width="208" height="184" rx="18" fill="#1C1C1F" stroke="#2C2C30" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="42" height="24" rx="12" fill="#102B19" stroke="#1E5933"/>
    <text x="37" y="32" text-anchor="middle" class="mono num" font-size="12" font-weight="700" fill="#6EE792">03</text>
    <text x="192" y="32" text-anchor="end" class="text" font-size="11.5" font-weight="700" fill="#8E8E93" letter-spacing="0.06em">PHYSICS</text>
    <text x="16" y="68" class="display" font-size="18" font-weight="700" fill="#F5F5F7" letter-spacing="-0.25">Docking &amp; FEP</text>
