  <g transform="translate(732, 56)">
    <rect x="0" y="0" width="208" height="184" rx="18" fill="#1C1C1F" stroke="#2C2C30" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="42" height="24" rx="12" fill="#33220B" stroke="#664415"/>
    <text x="37" y="32" text-anchor="middle" class="mono num" font-size="12" font-weight="700" fill="#FFC66D">04</text>
    <text x="192" y="32" text-anchor="end" class="text" font-size="11.5" font-weight="700" fill="#8E8E93" letter-spacing="0.06em">AGENTS</text>
    <text x="16" y="68" class="display" font-size="18" font-weight="700" fill="#F5F5F7" letter-spacing="-0.25">Agentic Evals</text>
