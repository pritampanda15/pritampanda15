<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 344" width="100%" role="img" aria-label="Closed-Loop AI, Physics and Agentic Drug Discovery Architecture">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="fbGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF375F"/>
      <stop offset="50%" stop-color="#30D158"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
        <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="128%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>

      .display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Monaco, Consolas, monospace; }
      .num { font-variant-numeric: tabular-nums; }

      @keyframes dashFwd { to { stroke-dashoffset: -36; } }
      @keyframes dashRev { to { stroke-dashoffset: 48; } }
      .fwd { stroke-dasharray: 6 6; animation: dashFwd 2.4s linear infinite; }
      .rev { stroke-dasharray: 7 6; animation: dashRev 3.2s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .fwd, .rev { animation: none !important; }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="1196" height="340" rx="24" fill="url(#bg)" stroke="#2C2C30" stroke-width="1.2"/>
  <line x1="26" y1="3" x2="1174" y2="3" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.2"/>

  <text x="28" y="34" class="text" font-size="13" font-weight="700" fill="#8E8E93" letter-spacing="0.08em">CLOSED-LOOP AI × PHYSICS × AGENTIC DISCOVERY ENGINE</text>
  <text x="1172" y="34" text-anchor="end" class="text" font-size="13" font-weight="500" fill="#8E8E93">Research-to-Therapeutic Architecture</text>

  <!-- Forward Connectors between stages (x=232..260, 468..496, 704..732, 940..968; y=148) -->
  <path d="M 232 148 L 260 148" stroke="#0A84FF" stroke-width="2" class="fwd"/>
  <path d="M 468 148 L 496 148" stroke="#BF5AF2" stroke-width="2" class="fwd"/>
  <path d="M 704 148 L 732 148" stroke="#30D158" stroke-width="2" class="fwd"/>
  <path d="M 940 148 L 968 148" stroke="#FF9F0A" stroke-width="2" class="fwd"/>

  <circle r="4" fill="#0A84FF" opacity="0">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 232 148 L 260 148"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#BF5AF2" opacity="0">
    <animateMotion dur="1.8s" begin="0.45s" repeatCount="indefinite" path="M 468 148 L 496 148"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.8s" begin="0.45s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#30D158" opacity="0">
    <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M 704 148 L 732 148"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#FF9F0A" opacity="0">
