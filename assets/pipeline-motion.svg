    <text x="16" y="108" class="text" font-size="13.5" fill="#D1D1D6">· PandaDock · AutoDock</text>
    <text x="16" y="134" class="text" font-size="13.5" fill="#D1D1D6">· OpenFE · PMX · MD</text>
    <text x="16" y="160" class="text" font-size="13.5" fill="#D1D1D6">· MLIPs · Psi4 · DFT</text>
