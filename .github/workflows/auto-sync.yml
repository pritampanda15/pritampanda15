name: Auto-Sync Profile Feeds

on:
  schedule:
    # Runs every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync YouTube tutorials, ORCID works & metrics
        run: python3 scripts/update_profile.py

      - name: Commit updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/impact-bento.svg assets/impact-bento-light.svg
          git diff --staged --quiet || (git commit -m "chore: auto-sync YouTube, ORCID & profile metrics" && git push)
